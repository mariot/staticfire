[project]
name = "staticfire-mailpit-collector"
version = "0.1.0"
description = "Test collector: answers OpenAEV email inject expectations from what a mailpit server received"
requires-python = ">=3.11"
dependencies = [
    "pyoaev",
    "requests",
]

[project.scripts]
mailpit-collector = "mailpit_collector.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailpit_collector"]
