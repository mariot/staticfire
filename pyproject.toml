[project]
name = "staticfire"
version = "0.1.0"
description = "Fire OpenAEV injectors and collectors against a real OpenAEV platform and check what they did"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "mcp>=2.3,<3",
]

[project.scripts]
staticfire = "staticfire.cli:main"
staticfire-mcp = "staticfire.mcp_server:main"

[dependency-groups]
dev = [
    "pyoaev",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/staticfire"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
